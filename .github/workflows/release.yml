name: Build Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\python -m pip install -r requirements.txt
      - name: Build exe
        shell: cmd
        run: call build.bat
      - name: Smoke test (exe starts the engine)
        shell: pwsh
        run: |
          $p = Start-Process dist\twitchTTS.exe -ArgumentList "--engine" -PassThru
          Start-Sleep -Seconds 25
          $ok = -not $p.HasExited
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "engine exited early (code $($p.ExitCode))" }
      - uses: actions/upload-artifact@v4
        with:
          name: twitchTTS-windows
          path: dist/twitchTTS.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.ref_name }} dist/twitchTTS.exe --clobber

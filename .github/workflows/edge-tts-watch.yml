name: Track edge-tts

# Daily: check that neural voices still synthesize with the newest edge-tts,
# and raise the edge-tts>= pin (requirements, README, CHANGELOG) when PyPI
# has a newer release. A failed run means Microsoft's speech service is
# rejecting the newest edge-tts too; GitHub emails the repo owner.
# Releases stay manual: the Windows exe only picks up a new edge-tts when a
# new version is tagged.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: edge-tts-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare pin with PyPI
        id: v
        run: python .github/scripts/edge_tts_watch.py check | tee -a "$GITHUB_OUTPUT"
      - name: Synthesis smoke test (newest edge-tts)
        run: |
          python -m pip install --quiet "edge-tts==${{ steps.v.outputs.latest }}"
          python .github/scripts/edge_tts_watch.py synth
      - name: Raise the pin
        if: steps.v.outputs.outdated == 'true'
        run: |
          python .github/scripts/edge_tts_watch.py bump "${{ steps.v.outputs.latest }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898748+github-actions[bot]@users.noreply.github.com"
          git add requirements.txt requirements-linux.txt README.md CHANGELOG.md
          git commit -m "Require edge-tts>=${{ steps.v.outputs.latest }}" \
                     -m "Automated by .github/workflows/edge-tts-watch.yml after a passing synthesis test."
          git push origin "HEAD:${GITHUB_REF_NAME}"

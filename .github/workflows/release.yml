name: Build Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\python -m pip install -r requirements.txt
      - name: Build exe
        shell: cmd
        run: call build.bat
      - name: Smoke test (engine starts, Piper synthesizes offline)
        shell: pwsh
        run: |
          $p = Start-Process dist\twitchTTS.exe -ArgumentList "--engine" -PassThru
          $api = "http://127.0.0.1:8080"
          $cfg = $null
          # First run downloads the default Piper voice (~60 MB).
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 3
            if ($p.HasExited) { throw "engine exited early (code $($p.ExitCode))" }
            try { $cfg = Invoke-RestMethod "$api/api/config" } catch { continue }
            if ($cfg.piper_voices -contains $cfg.piper_voice) { break }
          }
          try {
            if ($cfg.tts_modes -notcontains "piper") { throw "Piper missing from the exe (tts_modes: $($cfg.tts_modes))" }
            if ($cfg.piper_voices -notcontains $cfg.piper_voice) { throw "Piper voice $($cfg.piper_voice) never installed" }
            Invoke-RestMethod -Method Post "$api/api/voice" -ContentType "application/json" -Body '{"mode":"piper"}' | Out-Null
            $r = Invoke-WebRequest -UseBasicParsing "$api/api/tts?text=piper%20smoke%20test"
            $type = "$($r.Headers['Content-Type'])"
            if ($type -ne "audio/wav" -or $r.RawContentLength -lt 10000) { throw "Piper TTS failed: $type, $($r.RawContentLength) bytes" }
            "Piper OK: $type, $($r.RawContentLength) bytes"
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: twitchTTS-windows
          path: dist/twitchTTS.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.ref_name }} dist/twitchTTS.exe --clobber
